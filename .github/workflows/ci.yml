name: ci

on:
  push:
    branches: [main]
    tags: ['client/v*', 'proto/v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            proto/go.sum
            client/go.sum
      - run: make check-no-legacy-name
      - run: make test-identity
      - run: make build
      - run: make vet
      # test-race, test-linkdebug and fuzz-short side by side; make test
      # (the same tests without -race) is not run: test-race runs them all.
      - run: make test-ci
      - run: make check-testknobs
      - run: make check-linkvet
      # gosec over first-party code, gated by scripts/gosec-baseline.txt (as in
      # relay-server: findings landed unnoticed while it was not here).
      - run: make check-gosec
      # semgrep (docker, pinned image and rules), gated by
      # scripts/semgrep-baseline.txt: a finding landed unnoticed while it was not here.
      - run: make check-semgrep
      - run: make spec spec-mutants spec-cltraces spec-astraces
      # ProVerif is built from source once (scripts/fetch-proverif.sh).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/relay-proverif
          key: proverif-${{ runner.os }}-${{ hashFiles('scripts/fetch-proverif.sh') }}
      - run: make spec-proverif
      # the models' bindings against the code (spec/proverif/README.md "Bindings")
      - run: make spec-bindings
      - run: make check-spec-drift
