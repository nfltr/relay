\* scripts/spec-rootheld.sh check: one machine key, one admin key, one
\* verifier, chains of three entries, one forged entry. The smallest
\* constants at which every mutant is caught (first-seen needs two
\* verifiers: MemberLogTwo.cfg).
CONSTANTS
    Keys = {"k1"}
    Admins = {"a1"}
    V = {v1}
    Names <- CfgNames
    MaxLen = 3
    MaxForge = 1
    Mutant = "none"
    v1 = v1
    v2 = v2
SPECIFICATION Spec
INVARIANTS
    TypeOK
    AdmitOnlyLogged
    RevokedDelegateRefused
    NoForkAccepted
    Converge
