\* scripts/spec-rootheld.sh full (nightly, make spec-traces) and the
\* first-seen mutant: MemberLog.cfg with two verifiers, the smallest that
\* gives Converge something to compare (156,906 states, 2 to 4 minutes on the Mac).
CONSTANTS
    Keys = {"k1"}
    Admins = {"a1"}
    V = {v1, v2}
    Names <- CfgNames
    MaxLen = 3
    MaxForge = 1
    Mutant = "none"
    v1 = v1
    v2 = v2
SPECIFICATION Spec
INVARIANTS
    TypeOK
    AdmitOnlyLogged
    RevokedDelegateRefused
    NoForkAccepted
    Converge
