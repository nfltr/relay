\* make spec: invariants (AllFlowsEnd: UDPFlowLive.cfg, UDPFlowLarge.cfg);
\* two sources, one flow each side at most (so refusals and
\* drops happen), two session ids, s1 sends two datagrams, s2 one, one cut.
CONSTANTS
    s1 = s1
    s2 = s2
    Srcs = {s1, s2}
    Ids = {1, 2}
    Busy = s1
    N = 2
    MaxFlows = 1
    Q = 1
    W = 1
    MaxCuts = 1
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoDeliverAfterClose
    TableBounded
    MemoryBound
    NoHOL
PROPERTIES
    ClosedFinal
