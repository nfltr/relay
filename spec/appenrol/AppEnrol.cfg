\* mutant is caught here (scripts/spec-appenrol.sh ci).
CONSTANTS
    Users = {u1}
    Apps = {a1}
    HKeys = {k1, k2}
    Kx = kx
    Names = {n1, n2}
    CodeIds = {c1}
    MaxTime = 3
    CertLife = 1
    TokLife = 1
    AuthLife = 1
    MaxCerts = 4
    MaxToks = 2
