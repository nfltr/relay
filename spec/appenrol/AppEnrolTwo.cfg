\* Two people, one device key and one name: a sign-in of another person on
\* the device (mutant reauth-any-user, scripts/spec-appenrol.sh mutants).
CONSTANTS
    Users = {u1, u2}
    Apps = {a1}
    HKeys = {k1}
    Kx = kx
    Names = {n1}
    CodeIds = {c1}
    MaxTime = 3
    CertLife = 1
    TokLife = 1
    AuthLife = 1
    MaxCerts = 4
    MaxToks = 2
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    AttrsFixed
    SignInBindsKey
    CodeOnce
    DisabledUserBound
    RevokedUserCut
    RevokedAppCut
SYMMETRY Sym
