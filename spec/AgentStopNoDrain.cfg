\* make spec: one direct session (d1) and one relayed (r1), two
\* Listener.Close calls (c1, c2), no drain (the cycle does not wait for its primary), a grace of two, at
\* most one byte per session, the clock to four (one past the bound).
CONSTANTS
    d1 = d1
    r1 = r1
    c1 = c1
    c2 = c2
    Sessions = {d1, r1}
    Direct = {d1}
    Late = {}
    Closers = {c1, c2}
    Drain = 0
    Grace = 2
    MaxBytes = 1
    MaxTime = 4
    Mutant = "none"
    CloseWaits = FALSE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoSilentLoss
    NoEarlyReset
    ResetEndsInGrace
    StopInTime
    ExitAfterEnd
PROPERTIES
    NoDrainOnReset
