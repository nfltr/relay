\* make spec: liveness (AllFlowsEnd) at the smallest size that still has a
\* flow expired, a path lost, an association ended and replaced or
\* revoked: one source, two datagrams, two ids, two associations.
CONSTANTS
    s1 = s1
    Srcs = {s1}
    Adm = {s1}
    Busy = s1
    N = 2
    Ids = {1, 2}
    MaxEp = 2
    MaxFlowsC = 1
    MaxFlows = 1
    W = 1
    Q = 1
    Amp = 1
    R = 1
    B = 1
    MaxCuts = 1
    MaxLoss = 1
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoDeliverAfterClose
    NoCrossFlow
    NoDeliverAfterRevoke
    TableBounded
    MemoryBound
PROPERTIES
    ClosedFinal
    AllFlowsEnd
