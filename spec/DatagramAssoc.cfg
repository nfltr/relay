\* make spec: invariants (two admitted sources and the agent's cap:
\* DatagramAssocTwo.cfg; AllFlowsEnd: DatagramAssocLive.cfg). One admitted
\* source sending two datagrams and one spoofed source; one flow per
\* association each side, two ids, two associations; credit 1, the target
\* answering twice per datagram into a queue of 2; a budget of one reply
\* per datagram plus one; one end of an association, one death of the
\* direct connection.
CONSTANTS
    s1 = s1
    s2 = s2
    Srcs = {s1, s2}
    Adm = {s1}
    Busy = s1
    N = 2
    Ids = {1, 2}
    MaxEp = 2
    MaxFlowsC = 1
    MaxFlows = 1
    W = 1
    Q = 2
    Amp = 2
    R = 1
    B = 1
    MaxCuts = 1
    MaxLoss = 1
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoDeliverAfterClose
    NoCrossFlow
    NoDeliverAfterRevoke
    TableBounded
    MemoryBound
    NoHOL
    NoReflection
    AmpBound
PROPERTIES
    ClosedFinal
