\* make spec: one punch. The offer names o1 (the agent's mapping toward the
\* relay: under a symmetric NAT it may never answer) and o2 (someone else
\* answers there: refused); the agent's probes leave from p1 (a fresh
\* mapping where it answers) and p2 (one that never answers); s1 is an
\* off-path sender's untagged probe. Three dials at most, a bound of two
\* ticks.
CONSTANTS
    o1 = o1
    o2 = o2
    p1 = p1
    p2 = p2
    s1 = s1
    Offered = {o1, o2}
    Prflx = {p1, p2}
    Spoofed = {s1}
    Peer = {o1, p1}
    Rogue = {o2}
    MaxCands = 3
    Bound = 2
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OnlyTagged
    DialBound
    OnlyPeer
    OneConnection
PROPERTIES
    Ends
