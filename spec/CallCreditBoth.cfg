\* make spec: both directions credited at once on the connections they
\* share; one call stuck both ways, one healthy; windows of 1 frame and 2
\* frames each way (every frame read sends a window update), relay pipes of
\* 1, connection FIFOs of 2.
CONSTANTS
    Calls = {s, h}
    StuckReq = {s}
    StuckResp = {s}
    WReq = 1
    WResp = 1
    N = 2
    P = 1
    Q = 2
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoHOL
    BufferBound
    Conservation
    GrantBound
    Ordered
PROPERTIES
    HealthyDone
