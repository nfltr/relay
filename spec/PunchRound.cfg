\* make spec: one round toward a cone NAT pair. The relay's one-way delays
\* are 1 or 3 ticks each, per attempt (an asymmetry of up to 2, twice the
\* direct one-way delay of 1); the QUIC Initial retransmits every 2 ticks;
\* an attempt dials for 4 ticks, an exchange waits 7 for its offer.
CONSTANTS
    Delays = {1, 3}
    Dd = 1
    PTO = 2
    PunchBound = 4
    CtlBound = 7
    MaxAttempts = 3
    Kind = "cone"
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    RetryBound
    RetryOnlyNoAnswer
    InitialAfterProbe
    NeverHeld
    DirectOnlyWon
    FirstInitialWins
PROPERTIES
    Ends
