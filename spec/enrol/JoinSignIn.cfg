\* A sign-in join (orgenrol.JoinSignIn): pinned to root 2, the relay may
\* hand root 1 (recovery-signed, superseded) or the attacker's; the join
\* is held to the pinned root (JoinRootNotOlder, mutant
\* signin-any-recovery; lane SECFIX2, review S9).
CONSTANTS
    MaxRoot = 2
    TokGen = 2
    MaxTries = 3
    MaxKeys = 4
    MaxCerts = 4
    MaxLost = 1
    SignIn = TRUE
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneKeyPerToken
    NoIssueAfterRevoke
    NoRetiredKeyRevived
    RefusedOnlyForCause
    JoinRootsAreOwners
    JoinRootNotOlder
    BindOnlyStated
    BindOnlyOwnAccount
    JoinedBound
