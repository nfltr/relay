\* Enrol.cfg with a rebind (MaxRebinds 1: the machine moves to a new relay
\* machine id) and no forgeries, which the rebind does not touch: every
\* invariant; the rebind mutants and witnesses run on these constants.
CONSTANTS
    NM = 1
    NV = 1
    MaxTime = 4
    CertLife = 3
    RenewBefore = 1
    RenewGrace = 1
    CrlLife = 2
    MaxCrls = 3
    MaxRoot = 2
    MaxForged = 0
    MaxKeys = 4
    MaxRebinds = 1
    MaxLost = 0
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    RevocationBound
    RevokedMachineRefused
    NoExpiredSession
    NoRenewAfterRevoke
    ForgedOnlyUnderStolenRoot
    SessionsOnTrustedRoot
    RootsAreOwners
    MachineHoldsItsKey
    RebindBound
    RetiredRefused
    NoRenewOfRetired
    NoRenewPastGrace
    GraceOnlyNewest
    OldDiskNeverCertified
    MoveOnlyByKey
    MoveOnlyOwnAccount
    ReissueRetiresOnlyExpired
