\* CrlCarriers.cfg with a fresh-bounded service (lane SECFIX item 8,
\* nfltr up fresh:): its sessions end once the CRL held is 5 old (WarnAge:
\* the code's minimum, orgid.FreshMin; scripts/spec-enrol.sh check,
\* nightly; its mutants and witnesses in ci).
\* The issuer's CRL on two carriers (CrlCarriers.tla): CrlLife 6, re-signed
\* every 2, the copy put every 1 and read every 1, a member warning at age 5
\* (in the code 24 h, 1 h, 5 and 10 minutes, 2 h: Every + CopyEvery +
\* FollowEvery < WarnAge < CrlLife), an outage of 2 ridden, one
\* outage of the issuer, one of the mailbox, one relay restart, one
\* replica, a vanished copy alerted on after 2 (10 minutes).
CONSTANTS
    MaxTime = 7
    CrlLife = 6
    Every = 2
    CopyEvery = 1
    FollowEvery = 1
    Late = 1
    MaxCrls = 6
    MaxOutages = 1
    Replicas = {"r1"}
    Vanish = 2
    WarnAge = 5
    Ride = 2
    FreshAge = 5
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    RevocationBound
    RevokedMachineRefused
    NoSessionOnLapsed
    NoRenewAfterRevoke
    CurrentWithoutMailbox
    AlertOnlyOnIssuer
    AlertBeforeLapse
    AlertWhileIssuerDown
    PushBound
    RideOutage
    QuietWhileIssuerUp
    WarnWhileIssuerDown
    FreshBound
    FreshQuiet
