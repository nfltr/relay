\* The SSH host certificate with the 24 h machine certificate of step A
\* (lane ORGCERT72b, CertRide.tla): equal lives, so a step-A issuer's
\* certificates are what clients before it accept; one outage, a revoke at
\* any hour, every CRL withheld. CertRideOutage is CertRide.cfg's (72 h,
\* step B): a 24 h certificate lapses in an outage the CRL rides out
\* (mutant day-life) (scripts/spec-enrol.sh ci).
CONSTANTS
    MaxTime = 40
    CertLife = 24
    HostLife = 24
    HostBound = 24
    FollowEvery = 1
    Ride = 24
    HostRide = 7
    MaxOutages = 1
    Revokes = TRUE
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    HostRideOutage
    HostRevokeBound
