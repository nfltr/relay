    HostLife = 24
    HostBound = 24
    FollowEvery = 1
    Ride = 24
    HostRide = 7
    MaxOutages = 1
    Revokes = TRUE
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    CertRideOutage
    HostRideOutage
    HostRevokeBound
