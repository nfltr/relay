\* The issuer reads its requests only after the machine asked again
\* (2026-11-21/22): it answers the backlog, two serials for one key, and
\* the machine installs either; its certificate expires before the next
\* renewal is answered (CertLife 2, RenewGrace 2: an expiry inside the
\* bound; one verifier, one CRL). LiveSpec, every property and invariant (lane ORGRENEW
\* 2026-11-27, mutant grace-newest-serial).
CONSTANTS
    NM = 1
    NV = 1
    MaxTime = 5
    CertLife = 2
    RenewBefore = 1
    RenewGrace = 2
    CrlLife = 3
    MaxCrls = 1
    MaxRoot = 1
    MaxForged = 0
    MaxKeys = 6
    MaxRebinds = 0
    MaxLost = 0
    Backlog = TRUE
    Mutant = "none"
SPECIFICATION LiveSpec
PROPERTIES
    RenewsAfterExpiry
INVARIANTS
    TypeOK
    RevocationBound
    RevokedMachineRefused
    NoExpiredSession
    NoRenewAfterRevoke
    ForgedOnlyUnderStolenRoot
    SessionsOnTrustedRoot
    RootsAreOwners
    MachineHoldsItsKey
    RebindBound
    RetiredRefused
    NoRenewOfRetired
    NoRenewPastGrace
    GraceOnlyNewest
    OldDiskNeverCertified
