\* CrlCarriers.cfg with two replicas (lane MAILBOXSPOF2): a put lands on
\* either and the bus carries it to the other; a read lands on either
\* (r1, r2 model values: the replicas are interchangeable, SYMMETRY).
\* The issuer's CRL on two carriers (CrlCarriers.tla): CrlLife 6, re-signed
\* every 2, the copy put every 1 and read every 1, a member warning at age 5
\* (in the code 24 h, 1 h, 5 and 10 minutes, 2 h: Every + CopyEvery +
\* FollowEvery < WarnAge < CrlLife), an outage of 2 ridden, one
\* outage of the issuer, one of the mailbox, one relay restart, two
\* replicas, a vanished copy alerted on after 2 (10 minutes)
\* (scripts/spec-enrol.sh check, replicas: nightly; its mutants and witness
\* in ci).
CONSTANTS
    MaxTime = 7
    CrlLife = 6
    Every = 2
    CopyEvery = 1
    FollowEvery = 1
    Late = 1
    MaxCrls = 6
    MaxOutages = 1
    Replicas = {r1, r2}
    Vanish = 2
    WarnAge = 5
    Ride = 2
    Mutant = "none"
SPECIFICATION Spec
SYMMETRY ReplicaPerms
INVARIANTS
    TypeOK
    RevocationBound
    RevokedMachineRefused
    NoSessionOnLapsed
    NoRenewAfterRevoke
    CurrentWithoutMailbox
    AlertOnlyOnIssuer
    AlertBeforeLapse
    AlertWhileIssuerDown
    PushBound
    RideOutage
    QuietWhileIssuerUp
    WarnWhileIssuerDown
