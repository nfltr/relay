\* Enrol.cfg with fairness (LiveSpec): every revoke reaches every verifier,
\* every machine follows a rotation.
CONSTANTS
    NM = 1
    NV = 1
    MaxTime = 4
    CertLife = 3
    RenewBefore = 1
    CrlLife = 2
    MaxCrls = 3
    MaxRoot = 2
    MaxForged = 1
    MaxKeys = 4
    MaxLost = 0
    Mutant = "none"
SPECIFICATION LiveSpec
PROPERTIES
    TakesEffect
    MachinesFollowRotation
INVARIANTS
    TypeOK
    RevocationBound
    RevokedMachineRefused
    NoExpiredSession
    NoRenewAfterRevoke
    ForgedOnlyUnderStolenRoot
    SessionsOnTrustedRoot
    RootsAreOwners
    MachineHoldsItsKey
