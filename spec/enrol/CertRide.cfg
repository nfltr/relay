\* A machine certificate through outages of its renewal path
\* (CertRide.tla): the code's 72 h and the host certificate's 24 h,
\* outages up to 23 h in all (Ride 24, past the CRL's 22 h 45 min), two of
\* them, an ask every hour, 64 h (past a machine certificate's lapse in a
\* long outage); no revoke (CertRideHost.cfg) (scripts/spec-enrol.sh ci).
CONSTANTS
    MaxTime = 64
    CertLife = 72
    HostLife = 24
    HostBound = 24
    FollowEvery = 1
    Ride = 24
    HostRide = 7
    MaxOutages = 2
    Revokes = FALSE
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    CertRideOutage
    HostRideOutage
    HostRevokeBound
