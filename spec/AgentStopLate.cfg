\* make spec: a session that registers late (l1: before or during the
\* stop, then may move to its direct path), one Listener.Close (c1), a
\* drain of one tick, a grace of two, at most one byte, the clock to four
\* (one past the bound). scripts/spec.sh mutants adds a direct session
\* there at the stop (d1) for late-unreset's fresh grace.
CONSTANTS
    l1 = l1
    c1 = c1
    Sessions = {l1}
    Direct = {l1}
    Late = {l1}
    Closers = {c1}
    Drain = 1
    Grace = 2
    MaxBytes = 1
    MaxTime = 4
    Mutant = "none"
    CloseWaits = FALSE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoSilentLoss
    NoEarlyReset
    ResetEndsInGrace
    StopInTime
    ExitAfterEnd
PROPERTIES
    NoDrainOnReset
