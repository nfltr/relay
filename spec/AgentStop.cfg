\* make spec: one direct session (d1) and one relayed (r1), two
\* Listener.Close calls (c1, c2), a drain of one tick, a grace of two, at
\* most one byte per session, the clock to four (one past the bound).
CONSTANTS
    d1 = d1
    r1 = r1
    c1 = c1
    c2 = c2
    Sessions = {d1, r1}
    Direct = {d1}
    Closers = {c1, c2}
    Drain = 1
    Grace = 2
    MaxBytes = 1
    MaxTime = 4
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoSilentLoss
    NoEarlyReset
    ResetEndsInGrace
    StopInTime
    ExitAfterEnd
PROPERTIES
    NoDrainOnReset
