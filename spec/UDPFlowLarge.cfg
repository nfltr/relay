\* LARGE=1 make spec: UDPFlow.cfg's size with AllFlowsEnd (about 5 min):
\* two sources, three session ids, one flow each side, one cut.
CONSTANTS
    s1 = s1
    s2 = s2
    Srcs = {s1, s2}
    Ids = {1, 2, 3}
    Busy = s1
    N = 2
    MaxFlows = 1
    Q = 1
    W = 1
    MaxCuts = 1
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoDeliverAfterClose
    TableBounded
    MemoryBound
    NoHOL
PROPERTIES
    ClosedFinal
    AllFlowsEnd
