\* A restore from a backup the relay offers any published CRL not below the
\* copy's own (OfferAny: lane SECFIX2, review S8): the restore takes the
\* newest of the offer and the fleet's, so the restore resumes at or
\* above the fleet's Number (RestoreNotBehindFleet, mutant
\* restore-older-crl). CRLMonotone, RevokedStaysRevoked and
\* IssuerNotBehindFleet are not claimed: a CRL the relay withheld from
\* the fleet and the restore alike and hands the fleet after it is
\* outnumbered by the restored issuer's (OrgMove.tla RestoreNotBehindFleet,
\* the residual; scripts/spec-orgmove.sh restore).
CONSTANTS
    NH = 2
    Tokens = {1}
    Names = {1}
    MaxLog = 4
    MaxMoves = 1
    MaxCrl = 3
    MaxSend = 1
    MaxLostB = 1
    MaxBackup = 1
    MaxLostH = 2
    MaxCrash = 0
    MaxRevive = 2
    OfferAny = TRUE
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    AtMostOneIssuer
    OldCannotIssue
    RestoreNotBehindFleet
    TokenOnce
    FleetUnderServingIssuer
