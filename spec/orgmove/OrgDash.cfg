\* The organisation in the dashboard (OrgDash.tla): one member enrolled
\* twice, two groups (one in the bound), three time steps
\* (scripts/spec-orgmove.sh dash).
CONSTANTS
    Names = {"a"}
    Groups = {"g1", "g2"}
    Bound = {"g1"}
    MaxSerial = 2
    MaxTime = 1
    Life = 2
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ShownSigned
    ShownNotAfterTrue
    RevokedOnlyApproved
    RenewOnlyByRoot
    NotAfterMonotone
    RootSignsOnlyAsked
    CertInBound
    CertGroupsFromIssuer
    OneOrgPerAccount
    AccountGroupsOneBound
