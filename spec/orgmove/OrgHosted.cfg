\* The hosted issuer's delegation (OrgHosted.tla): the issuer key moving
\* self -> hosted -> self, a hosted standby, a compromise of the hosted
\* machine, the root's revocation (scripts/spec-orgmove.sh hosted).
CONSTANTS
    MaxTime = 4
    DelegLife = 2
    CertLife = 2
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    AtMostOneIssuer
    ServingAuthorized
    DelegationBound
    RevokedIssuerRefused
    RootCRLCurrent
