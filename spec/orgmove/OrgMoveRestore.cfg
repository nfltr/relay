\* A restore from a backup (OrgMove.tla Revive): the organisation lost
\* (its host's disk gone, no move under way), a backup copy moved onto a
\* host after it takes the newest published CRL (its Number resumed there,
\* its revocations merged, the copy's tokens void); twice, so a copy
\* restored again after the restored host is lost is checked too.
\* AuditContinuous is not claimed: acts after the copy are lost by design
\* (scripts/spec-orgmove.sh restore).
CONSTANTS
    NH = 2
    Tokens = {1}
    Names = {1}
    MaxLog = 4
    MaxMoves = 1
    MaxCrl = 3
    MaxSend = 1
    MaxLostB = 1
    MaxBackup = 1
    MaxLostH = 2
    MaxCrash = 0
    MaxRevive = 2
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    AtMostOneIssuer
    OldCannotIssue
    CRLMonotone
    RevokedStaysRevoked
    TokenOnce
    FleetUnderServingIssuer
