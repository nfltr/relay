\* make spec (lane ONEREVOKE): a refused client's line among sessions,
\* their recovery and the rotation (Refuse; mutant refused-as-open). The
\* other configurations write none (MaxRef = 0): Refuse touches only the
\* log, so a smaller machine covers it.
CONSTANTS
    Procs = {p1, p2}
    MayCrash = {p1}
    Sess = {s1, s2}
    MaxRot = 1
    MaxRef = 1
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    AtMostOneClose
    CloseHasOpen
    LiveOpenNotClosed
    NothingLost
    OpenIsAdmitted
    OneLog
