\* make spec: invariants with two admitted sources in one association: the
\* client's cap above the agent's, so the agent refuses a flow; one
\* datagram each, no death of the direct connection.
CONSTANTS
    s1 = s1
    s2 = s2
    Srcs = {s1, s2}
    Adm = {s1, s2}
    Busy = s1
    N = 1
    Ids = {1, 2}
    MaxEp = 1
    MaxFlowsC = 2
    MaxFlows = 1
    W = 1
    Q = 1
    Amp = 1
    R = 1
    B = 1
    MaxCuts = 1
    MaxLoss = 0
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoDeliverAfterClose
    NoCrossFlow
    NoDeliverAfterRevoke
    TableBounded
    MemoryBound
    NoHOL
    NoReflection
    AmpBound
PROPERTIES
    ClosedFinal
