\* make spec: one spray attempt, easy client and hard agent after a failed
\* attempt. The hard side's NAT has three possible ports and gives its two
\* auxiliary sockets two of them; the easy side guesses at most three
\* times, two per tick, within two ticks. Every guess may be lost.
CONSTANTS
    Ports = {1, 2, 3}
    K = 2
    N = 3
    Rate = 2
    Bound = 2
    EdmE = FALSE
    EdmH = TRUE
    FirstFailed = TRUE
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    SprayOnlyEasyHard
    SprayBound
    SprayOnlyPeer
    OneConnection
    AuxClosed
    DirectIfHit
PROPERTIES
    Ends
    HitGoesDirect
