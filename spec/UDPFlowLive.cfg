\* make spec: liveness (AllFlowsEnd) at the smallest size that still has
\* a flow refused, expired, cut and replaced: one source, two datagrams,
\* two session ids, one flow each side, one cut.
CONSTANTS
    s1 = s1
    Srcs = {s1}
    Ids = {1, 2}
    Busy = s1
    N = 2
    MaxFlows = 1
    Q = 1
    W = 1
    MaxCuts = 1
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoDeliverAfterClose
    TableBounded
    MemoryBound
PROPERTIES
    ClosedFinal
    AllFlowsEnd
