# Generated Go lives beside each .proto (paths=source_relative). Local
# plugins (go install): protoc-gen-go, protoc-gen-go-grpc,
# protoc-gen-grpc-gateway. Run from proto/: buf generate.
version: v2
managed:
  enabled: true
  disable:
    - module: buf.build/googleapis/googleapis
plugins:
  - local: protoc-gen-go
    out: .
    opt: [paths=source_relative]
  - local: protoc-gen-go-grpc
    out: .
    opt: [paths=source_relative, require_unimplemented_servers=false]
  - local: protoc-gen-grpc-gateway
    out: .
    opt: [paths=source_relative]
